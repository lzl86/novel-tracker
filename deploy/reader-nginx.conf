server {
 listen 80;
 server_name logicnexus.icu;
 root /var/www/novel-reader;
 location /.well-known/acme-challenge/ { try_files $uri =404; }
 location / { return 301 https://logicnexus.icu$request_uri; }
}
server {
 listen 443 ssl;
 server_name logicnexus.icu;
 ssl_certificate /etc/letsencrypt/live/logicnexus.icu/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/logicnexus.icu/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 root /var/www/novel-reader;
 autoindex off;
 location = /reader { return 301 /reader/; }
 location = /reader/releases.json { add_header Cache-Control "no-store" always; try_files $uri =404; }
 location = /reader/index.html { add_header Cache-Control "no-cache" always; }
 location = /reader/ { add_header Cache-Control "no-cache" always; index index.html; }
 location /reader/releases/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
 location / { return 404; }
}
